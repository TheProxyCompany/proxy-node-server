name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: [self-hosted, ci-cd]
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          printf '%s\n' "$HOME/.cargo/bin" /opt/homebrew/bin >> "$GITHUB_PATH"
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
      - run: cargo fmt --all -- --check

  msrv:
    name: msrv (1.85)
    runs-on: [self-hosted, ci-cd]
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - uses: actions/checkout@v4
      - run: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          printf '%s\n' "$HOME/.cargo/bin" /opt/homebrew/bin >> "$GITHUB_PATH"
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-features

  build-test:
    name: build + test
    runs-on: [self-hosted, ci-cd]
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@v4
      - run: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          printf '%s\n' "$HOME/.cargo/bin" /opt/homebrew/bin >> "$GITHUB_PATH"
          rustup toolchain install 1.97.1 --profile minimal --component clippy --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Build (all features)
        run: cargo build --locked --all-features
      - name: Build (library, no default features)
        run: cargo build --locked --no-default-features
      - name: Test HTTP, native process, crypto, and signed peer boundaries
        run: cargo test --locked --all-features --lib --test n_node_sync --test two_node_sync
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
